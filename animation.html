<!DOCTYPE html>
<html>
<head>
<title>My Animation</title>
<style>
body {
  background-color: lightgreen;
  text-align: center;
}
.box {
  width: 120px;
  height: 120px;
  background-color: red;
  position: relative;
  animation: move 3s infinite alternate;
}
@keyframes move {
  from { left: 0px; }
  to { left: 200px; }
}
</style>
</head>
<body>
<h2>My First Animation</h2>
<div class="box"></div>
</body>
</html>
